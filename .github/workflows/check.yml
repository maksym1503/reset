name: Reset CI
on: [push, pull_request]
jobs:
  check:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Swift tests
        run: swift test
      - name: iPhone Simulator build
        run: xcodebuild -project Reset.xcodeproj -scheme Reset -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
